name: make_examples function build of deepvariants

on:
  push:
  workflow_dispatch:


jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          # list of Docker images to use as base name for tags
          images: |
            ${{ secrets.DH_USER }}/deepvariant
          # generate Docker tags based on the following events/attributes
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: Dockerfile.makeexample
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DH_USER }}/deepvariant:make-examples-1.8.0-v1
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DH_USER }}/deepvariant:cache
          cache-to: type=registry,ref=${{ secrets.DH_USER }}/deepvariant:cache,mode=max